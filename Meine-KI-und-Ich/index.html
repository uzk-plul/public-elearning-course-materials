:root{
  --ground:#F9F5F2; --paper:#ffffff; --peach:#F2DFD1; --line:#e3d6c9; --line-strong:#c7b8a8;
  --ink:#2E2E1F; --olive-ink:#464719; --muted:#5f5e4a;
  --petrol:#156082; --petrol-dark:#0d4560; --petrol-tint:#e5eff4;
  --olive:#B4A64B; --rose:#D6A6B1; --orange:#D2682B; --peri:#98A8D9;
  --err:#a3271d;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--ink)}
body{font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.55}
a{color:var(--petrol)}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 48px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Kopf mit Fortschritt */
.top{position:sticky;top:0;z-index:5;background:var(--ground);border-bottom:1px solid var(--line)}
.top-in{max-width:860px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px}
.brand{font-weight:700;color:var(--olive-ink);white-space:nowrap}
.bar{flex:1;height:8px;background:var(--peach);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--petrol);border-radius:99px;transition:width .3s}
.pct{font-size:14px;color:var(--muted);min-width:3.2em;text-align:right}

/* Startseite */
.hero{position:relative;overflow:hidden;background:var(--paper);border-radius:16px;margin-top:24px;padding:40px 36px 120px;border:1px solid var(--line)}
.hero .kick{font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--petrol)}
.hero h1{font-weight:400;font-size:clamp(34px,6vw,52px);line-height:1.05;margin:10px 0 4px;color:var(--olive-ink)}
.hero .sub{font-size:clamp(20px,3.2vw,27px);color:var(--olive-ink);line-height:1.25}
.arcs{position:absolute;left:0;right:0;bottom:0;height:100px;pointer-events:none}
.arcs i{position:absolute;border-radius:50%;display:block}
.lead p{margin:0 0 12px}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:8px 0 0}
.step{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px}
.step b{display:block}
.step .n{width:34px;height:34px;border-radius:50%;background:var(--petrol);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.step .n.opt{background:#fff;color:var(--petrol);outline:2px dashed var(--petrol);outline-offset:-2px}
.step small{color:var(--muted);display:block;font-size:14px}
.badges{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}
.badge{display:flex;gap:8px;align-items:center;background:var(--paper);border:2px solid var(--olive);border-radius:8px;padding:8px 14px;font-weight:700;font-size:15px}
.note{background:var(--peach);border-radius:12px;padding:16px 18px;font-size:16px}
.note strong{color:var(--olive-ink)}

/* Seiten */
.pagehead{margin:28px 0 18px;display:flex;gap:16px;align-items:center}
.ico{flex:none;width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.ico svg{width:26px;height:26px}
.pagehead .k{font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--petrol)}
.pagehead h2{margin:2px 0 0;font-weight:400;font-size:clamp(26px,4.4vw,34px);line-height:1.15;color:var(--olive-ink)}
h2:focus{outline:none}
.intro{background:var(--paper);border-left:6px solid var(--olive);border-radius:8px;padding:14px 18px;margin:0 0 18px;font-size:16px}
.subhead{font-weight:700;color:var(--olive-ink);font-size:20px;margin:30px 0 12px;padding-bottom:6px;border-bottom:2px solid var(--peach)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:22px 24px;margin:0 0 16px}
.card[hidden]{display:none}
.qt{font-weight:700;font-size:18px;line-height:1.45}
.qt p{margin:0 0 8px}.qt p:last-child{margin-bottom:0}
.qt ul{font-weight:400;font-size:16px;margin:10px 0 0;padding-left:20px}
.qt li{margin:2px 0}
.help{font-style:italic;color:var(--muted);font-size:15px;margin-top:6px}
.req{color:var(--err);font-weight:700}
.field{margin-top:14px}
textarea,input[type=text]{width:100%;font:inherit;color:inherit;background:#fffdfb;border:1.5px solid var(--line-strong);border-radius:8px;padding:10px 12px}
textarea{min-height:120px;resize:vertical}
textarea.short{min-height:64px}
textarea:focus,input[type=text]:focus{outline:3px solid rgba(21,96,130,.35);border-color:var(--petrol)}
.lab{display:block;font-weight:700;font-size:16px;margin:12px 0 6px}

/* Auswahl-Kacheln */
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.opts.one{grid-template-columns:minmax(0,1fr)}
.opt{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--line-strong);border-radius:10px;padding:12px 14px;cursor:pointer;background:#fffdfb;min-height:48px}
.opt input{margin:3px 0 0;width:20px;height:20px;accent-color:var(--petrol);flex:none}
.opt:has(input:checked){border-color:var(--petrol);background:var(--petrol-tint)}
.opt:has(input:focus-visible){outline:3px solid rgba(21,96,130,.35)}
.opt.wide{grid-column:1/-1}
.opt.other{flex-wrap:wrap}
.opt.other input[type=text]{flex:1 1 220px;margin-top:-4px}

/* Tabellen */
.tbl{width:100%;border-collapse:separate;border-spacing:0;margin-top:14px;font-size:15.5px}
.tbl th,.tbl td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:center;vertical-align:middle}
.tbl thead th{font-size:14px;font-weight:700;color:var(--olive-ink);background:var(--peach)}
.tbl.input thead th{position:sticky;top:46px}
.tbl thead th:first-child{border-top-left-radius:8px}.tbl thead th:last-child{border-top-right-radius:8px}
.tbl tbody th{text-align:left;font-weight:400;width:38%}
.tbl tbody tr:nth-child(even) td,.tbl tbody tr:nth-child(even) th{background:#fcf8f5}
.tbl input{width:22px;height:22px;accent-color:var(--petrol);cursor:pointer;margin:0}
.tbl label{display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;cursor:pointer}
.tbl .cl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.dot{color:var(--petrol);font-size:18px}
.empty{color:var(--muted);font-style:italic}
@media (max-width:720px){
  .opts{grid-template-columns:minmax(0,1fr)}
  .steps{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tbl.input thead{display:none}
  .tbl.input,.tbl.input tbody,.tbl.input tr{display:block;width:100%}
  .tbl.input tr{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px;background:#fffdfb}
  .tbl.input tbody th{display:block;width:auto;border:0;padding:0 0 8px;font-weight:700;background:none!important}
  .tbl.input td{display:inline-block;border:0;padding:0 6px 6px 0;background:none!important}
  .tbl.input label{border:1.5px solid var(--line-strong);border-radius:99px;padding:6px 12px 6px 8px;gap:6px;min-height:40px}
  .tbl.input label:has(input:checked){border-color:var(--petrol);background:var(--petrol-tint)}
  .tbl.input .cl{position:static;width:auto;height:auto;clip:auto;font-size:15px}
  .tbl.input input{width:18px;height:18px}
  .card{padding:18px 16px}
  .hero{padding:28px 22px 110px}
}

/* Beispiele Teil B */
.ex{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:0 0 16px}
.quote{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px 20px;position:relative}
.quote .who{display:inline-block;font-weight:700;font-size:14px;color:#fff;background:var(--petrol);border-radius:99px;padding:2px 12px;margin-bottom:8px}
.quote p{margin:0;font-size:16.5px}
@media (max-width:720px){.ex{grid-template-columns:minmax(0,1fr)}}
.showA{background:#f6f9fb;border:1px solid #d3e2ea;border-radius:14px;padding:16px 18px;margin:0 0 16px}
.showA h3{margin:0;font-size:16px;color:var(--petrol)}

/* Übersicht */
details.ov{background:var(--paper);border:1px solid var(--line);border-radius:12px;margin:0 0 10px}
details.ov>summary{cursor:pointer;padding:14px 18px;font-weight:700;font-size:17px;display:flex;align-items:center;gap:12px;list-style:none}
details.ov>summary::-webkit-details-marker{display:none}
details.ov>summary .ico{width:34px;height:34px}
details.ov>summary .ico svg{width:18px;height:18px}
details.ov>summary::after{content:"+";margin-left:auto;font-size:22px;color:var(--petrol)}
details.ov[open]>summary::after{content:"–"}
.ovb{padding:0 18px 16px}
.ovb h4{margin:16px 0 6px;font-size:15px;color:var(--petrol);text-transform:uppercase;letter-spacing:.05em}
.qa{border-left:4px solid var(--petrol);background:#f6f9fb;padding:10px 14px;margin:0 0 10px;border-radius:0 8px 8px 0}
.qa .q{font-size:14.5px;color:var(--muted)}
.qa .a{white-space:pre-wrap}
.ovb .tbl{font-size:14.5px;margin-top:6px}
.ovb .tbl thead th{position:static}
.recall{border-left:4px solid var(--petrol);background:#f6f9fb;padding:10px 14px;margin:0 0 10px;border-radius:0 8px 8px 0}
.recall .q{font-size:14.5px;color:var(--muted)}

/* Navigation */
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:26px;flex-wrap:wrap}
.btn{font:inherit;font-weight:700;font-size:17px;border-radius:10px;padding:12px 22px;min-height:48px;cursor:pointer;border:2px solid var(--petrol);display:inline-flex;align-items:center;gap:10px;text-decoration:none}
.btn.pri{background:var(--petrol);color:#fff}
.btn.pri:hover{background:var(--petrol-dark);border-color:var(--petrol-dark)}
.btn.sec{background:transparent;color:var(--petrol)}
.btn.sec:hover{background:var(--petrol-tint)}
.btn:focus-visible{outline:3px solid rgba(21,96,130,.45);outline-offset:2px}
.btn svg{width:18px;height:18px}
.err{color:var(--err);font-weight:700;margin-top:10px}
.card.bad{border-color:var(--err);box-shadow:0 0 0 2px rgba(163,39,29,.15)}
.resume{background:var(--paper);border:2px solid var(--petrol);border-radius:14px;padding:18px 20px;margin-top:20px}
.resume .row{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.foot{margin-top:40px;font-size:14px;color:var(--muted);text-align:center}

@media print{
  .top,.nav,.noprint{display:none!important}
  body{background:#fff;font-size:12pt}
  details.ov{break-inside:avoid;border-color:#bbb}
  details.ov>summary::after{content:""}
  .card,.qa{break-inside:avoid}
}

var Q = {};

/* ===================== Zustand ===================== */
var KEY = "meine-ki-und-ich.v1";
var A = {}, hist = [], cur = "start";
function store(){ try{ localStorage.setItem(KEY, JSON.stringify({A:A,hist:hist,cur:cur,t:Date.now()})); }catch(e){} }
function load(){ try{ var s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; }catch(e){ return null; } }
function wipe(){ try{ localStorage.removeItem(KEY); }catch(e){} }

/* ===================== Hilfsfunktionen ===================== */
function el(tag, attrs, kids){
  var n = document.createElement(tag);
  if(attrs) for(var k in attrs){
    var v = attrs[k];
    if(v==null || v===false) continue;
    if(k==="html") n.innerHTML = v;
    else if(k==="text") n.textContent = v;
    else if(k.slice(0,2)==="on") n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v===true ? "" : v);
  }
  (kids||[]).forEach(function(c){ if(c==null) return; n.appendChild(typeof c==="string" ? document.createTextNode(c) : c); });
  return n;
}
function icon(area, size){
  var a = AREAS[area];
  var d = el("div",{class:"ico",style:"background:"+a.bg+";color:"+a.fg, "aria-hidden":"true"});
  d.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+ICONS[area]+'</svg>';
  if(size){ d.style.width=size+"px"; d.style.height=size+"px"; }
  return d;
}
function plain(html){ var d=document.createElement("div"); d.innerHTML=html.replace(/<\/(p|li)>|<br\s*\/?>/gi," "); return d.textContent.replace(/\s+/g," ").trim(); }
function filled(s){ return typeof s==="string" && s.trim()!==""; }
var uid = 0; function nid(p){ uid++; return (p||"f")+uid; }

/* Zeilen der Tabellen (Array-Filter wie in LimeSurvey) */
function rowsFor(kind){
  if(kind==="komm") return KOMM.slice();
  var sel = A.G01Q03 || {};
  var r = ACT.filter(function(a){ return sel[a[0]]; });
  if(sel.other && filled(A.G01Q03_other)) r.push(["other", A.G01Q03_other.trim()]);
  return r;
}

/* ===================== Seitenlogik ===================== */
function visible(p){ return !p.rel || p.rel(); }
function pageById(id){ for(var i=0;i<PAGES.length;i++) if(PAGES[i].id===id) return PAGES[i]; return null; }
function nextPage(id){
  var i = PAGES.indexOf(pageById(id));
  for(var j=i+1;j<PAGES.length;j++) if(visible(PAGES[j])) return PAGES[j].id;
  return "fertig";
}
function pathEstimate(){
  /* sichtbare Seiten; Teil B zählt nur, wenn schon gewählt */
  return PAGES.filter(visible).map(function(p){ return p.id; });
}
function progress(){
  var top = document.getElementById("top");
  if(cur==="start"){ top.hidden = true; return; }
  top.hidden = false;
  var path = pathEstimate(), pct;
  if(cur==="fertig") pct = 100;
  else { var i = path.indexOf(cur); pct = Math.round(100 * Math.max(0,i) / path.length); }
  document.getElementById("barfill").style.width = pct+"%";
  document.getElementById("pct").textContent = pct+" %";
  var bar = document.getElementById("bar"); bar.setAttribute("aria-valuenow", pct);
}

function go(id, push){
  if(push) hist.push(cur);
  cur = id; store(); render();
  window.scrollTo(0,0);
  var h = document.querySelector("h1,h2"); if(h){ h.setAttribute("tabindex","-1"); h.focus({preventScroll:true}); }
}

/* ===================== Eingabe-Bausteine ===================== */
function qcard(it, inner){
  var c = el("section",{class:"card", "data-q":it.id||""});
  var tid = nid("qt");
  c.appendChild(el("div",{class:"qt", id:tid, html:(it.text||"") + (it.mand ? ' <span class="req" aria-hidden="true">*</span>' : "")}));
  if(it.help) c.appendChild(el("div",{class:"help", text:it.help}));
  inner.forEach(function(n){ c.appendChild(n); });
  c.setAttribute("aria-labelledby", tid);
  if(it.rel) c.hidden = !it.rel();
  return c;
}
function changed(){ store(); refreshRel(); }

  var id = nid("t");
  var ta = el("textarea",{id:id, "aria-label":plain(it.text||"Antwort")});
  ta.value = A[it.id] || "";
  ta.addEventListener("input", function(){ A[it.id] = ta.value; store(); });
  return qcard(it,[el("div",{class:"field"},[ta])]);
}

function inActivities(it){
  A.G01Q03 = A.G01Q03 || {};
  var sel = A.G01Q03;
  var g = el("div",{class:"opts", role:"group"});
  var boxes = {};
  function setNicht(on){
    if(on){ ACT.forEach(function(a){ sel[a[0]] = false; boxes[a[0]].checked = false; }); sel.other=false; boxes.other.checked=false; }
  }
  ACT.forEach(function(a){
    var cb = el("input",{type:"checkbox"}); boxes[a[0]] = cb;
    cb.checked = !!sel[a[0]];
    cb.addEventListener("change", function(){ sel[a[0]] = cb.checked; if(cb.checked){ sel.nicht=false; boxes.nicht.checked=false; } changed(); });
    g.appendChild(el("label",{class:"opt"},[cb, el("span",{text:a[1]})]));
  });
  /* Sonstiges */
  var ocb = el("input",{type:"checkbox", "aria-label":"Andere Tätigkeit(en)"}); boxes.other = ocb;
  ocb.checked = !!sel.other;
  var otx = el("input",{type:"text", placeholder:"Andere Tätigkeit(en)", "aria-label":"Andere Tätigkeit(en) beschreiben"});
  otx.value = A.G01Q03_other || "";
  ocb.addEventListener("change", function(){ sel.other = ocb.checked; if(ocb.checked){ sel.nicht=false; boxes.nicht.checked=false; otx.focus(); } changed(); });
  otx.addEventListener("input", function(){ A.G01Q03_other = otx.value; var on = filled(otx.value); sel.other = on; ocb.checked = on; if(on){ sel.nicht=false; boxes.nicht.checked=false; } store(); });
  g.appendChild(el("label",{class:"opt other wide"},[ocb, el("span",{text:"Andere Tätigkeit(en):"}), otx]));
  /* nicht genutzt (schließt alles andere aus) */
  var ncb = el("input",{type:"checkbox"}); boxes.nicht = ncb;
  ncb.checked = !!sel.nicht;
  ncb.addEventListener("change", function(){ sel.nicht = ncb.checked; setNicht(ncb.checked); changed(); });
  g.appendChild(el("label",{class:"opt wide", style:"margin-top:6px"},[ncb, el("span",{html:"<strong>"+NICHT[1]+"</strong>"})]));
  return qcard(it,[g]);
}
function emptyRowsNote(){ return el("p",{class:"empty", text:"Sie haben am Anfang keine Tätigkeit ausgewählt – hier gibt es daher nichts einzuordnen."}); }
function inScale(it){
  var rows = rowsFor(it.rows), sc = SCALES[it.scale];
  A[it.id] = A[it.id] || {};
  if(!rows.length) return qcard(it,[emptyRowsNote()]);
  var t = el("table",{class:"tbl input"});
  var hr = el("tr",{},[el("th",{scope:"col"},[el("span",{class:"sr", text:it.rows==="komm"?"Kommunikationsform":"Tätigkeit"})])]);
  sc.forEach(function(s){ hr.appendChild(el("th",{scope:"col", text:s})); });
  t.appendChild(el("thead",{},[hr]));
  var tb = el("tbody");
  rows.forEach(function(r){
    var name = nid("s"), tr = el("tr");
    var th = el("th",{scope:"row", text:r[1]}); tr.appendChild(th);
    sc.forEach(function(s,i){
      var v = String(i+1);
      var inp = el("input",{type:"radio", name:name, value:v, "aria-label":r[1]+": "+s});
      inp.checked = A[it.id][r[0]]===v;
      /* erneutes Anklicken hebt die Auswahl auf */

      inp.addEventListener("click", function(){
        if(inp._was){ inp.checked = false; delete A[it.id][r[0]]; inp._was=false; store(); return; }
        A[it.id][r[0]] = v; store();
      });
      var lab = el("label",{},[inp, el("span",{class:"cl", text:s})]);
      lab.addEventListener("pointerdown", function(){ inp._was = inp.checked; });
      tr.appendChild(el("td",{},[lab]));
    });
    tb.appendChild(tr);
  });
  t.appendChild(tb);
  return qcard(it,[t, el("div",{class:"help", text:"Ein erneuter Klick auf eine Auswahl hebt sie wieder auf."})]);
}

    var x = data[r[0]]||{};
    var tr = el("tr",{},[el("th",{scope:"row", text:r[1]})]);

function tableScale(qid, onlyFilled, asGrid){

    else tr.appendChild(el("td",{style:"text-align:left", text: v ? sc[+v-1] : "–"}));

function showA(it){
