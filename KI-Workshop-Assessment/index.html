document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

}\n.result-actions{display:flex;gap:9px}\n.footer-note{margin-top:18px;text-align:center;font-size:11.5px;color:var(--gray-500);letter-spacing:.04em}\n.key-hint{text-align:center;font-size:11px;color:var(--gray-500);margin-top:10px}\n.modal-backdrop{position:fixed;inset:0;background:rgba(0,32,47,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}\n.modal{background:#fff;border-radius:12px;max-width:380px;width:100%;padding:24px}\n.modal-title{font-size:17px;font-weight:700;color:var(--blue);margin-bottom:8px}\n.modal-text{font-size:13.5px;line-height:1.6;color:var(--gray-600);margin-bottom:18px}\n.modal-actions{display:flex;gap:9px}\n.modal-actions .btn-next{flex:1}\n@page{size:A4 portrait;margin:12mm}\n@media print{html,body{background:#fff;padding:0;display:block}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}.topbar,.progress-track,.result-actions,.btn-back,.key-hint{display:none!important}.shell{max-width:none}.card{box-shadow:none;border:1px solid var(--gray-200);border-radius:0;animation:none}.result-head{padding:18px 22px}.result-body{gap:14px;padding:16px 20px}}\n@media (max-width:520px){body{padding:20px 12px 40px}.q-head{padding:22px 20px 18px}.q-text{font-size:17px}.q-body{padding:14px 16px 20px}.result-head{padding:24px 20px}.result-body{padding:18px 16px 22px}.profile{grid-template-columns:repeat(2,minmax(0,1fr))}.chip-grid{grid-template-columns:1fr}.mod{grid-template-columns:26px 1fr}.mod-z{grid-column:2}}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n<div class=\"shell\" id=\"app\"><\u002Fdiv>\n<script>\n/* ── Bausteine (Stand: Workshopkonzept v1.2 / Moderationsfolien v2) ── */\nconst M={\n BASIS:{c:'Basismodul',t:'KI im Arbeitsalltag',z:60,d:'Grundlagen, Anwendungsfelder, Regeln und Unterstützung an der UzK.',req:[]},\n O1:{t:'Begriffe & Konzepte',z:30,d:'Gemeinsame Sprachbasis: Prompt, Modell, Token, Kontextfenster, Halluzination, Bias.',req:[]},\n O2:{t:'Funktionsweise von Sprachmodellen',z:45,d:'Verstehen, wie KI Antworten erzeugt und warum sie sich irrt.',req:['O1']},\n O3:{t:'KI-Landschaft & Tools',z:45,d:'Orientierung bei der Toolauswahl, KI:connect als Standard der UzK.',req:['O1']},\n O4:{t:'Erste Schritte Prompting',z:45,d:'Gute Prompts formulieren, Prompt-Werkstatt mit Peer-Feedback.',req:['O1']},\n O5:{t:'KI im Verwaltungsalltag',z:45,d:'Einsatzfelder und Grenzen im eigenen Alltag erkennen.',req:['O4']},\n O6:{t:'Fehler erkennen',z:30,d:'Fehlertypen kennen und eine Prüfroutine etablieren.',req:[['O2','O5']]},\n O7:{t:'Recht, Ethik, Datenschutz & Bias',z:45,d:'Rechtsrahmen, Vertraulichkeitsklassen, Formen von Bias.',req:['O4','O5','O6']},\n O8:{t:'KI-Sorgen & Arbeitsplatzängste',z:45,d:'Geschützter Raum für Sorgen, realistische Einschätzungen.',req:[]},\n O9:{t:'KI in Studium und Lehre',z:60,d:'Einsatzfelder in der Lehre kartieren, eigene Veranstaltungsregeln formulieren.',req:[]},\n O10:{t:'Akademische Integrität & Kennzeichnung',z:60,d:'Eigenständigkeit, Kennzeichnung und Grenzen von KI-Detektoren.',req:['O9']},\n O11:{t:'KI & wissenschaftliches Schreiben',z:45,d:'Rolle von KI im Schreibprozess und Anleitung von Studierenden.',req:['O4']},\n V1:{t:'Fortgeschrittenes Prompting & Prompt-Design',z:45,d:'Mehrschrittige Aufträge mit Leitplanken und Kontrollpunkten delegieren.',req:['O4']},\n V2:{t:'KI-gestützte Workflows',z:60,d:'Prozesse kartieren, KI-geeignete Schritte und Kontrollpunkte festlegen.',req:['O5']},\n V3:{t:'Qualitätssicherung & kritische Evaluation',z:45,d:'Systematisches Prüfraster und kontextabhängige Prüftiefe.',req:['V1']},\n V4:{t:'KI-Governance & Regelentwicklung',z:60,d:'Partizipativ ein Team-Regelwerk mit höchstens zwölf Regeln entwickeln.',req:['V1']},\n V5:{t:'KI-Projekte konzipieren, steuern & auswerten',z:90,d:'Vom Vorhaben zur Projektskizze mit Pilot und Wirkungsindikatoren.',req:['V4']},\n V6:{t:'Barrierefreiheit & Einfache Sprache mit KI',z:45,d:'Verständliche, barrierearme Kommunikation bis zu Alt-Texten.',req:[['O4','V1']]},\n V7:{t:'Prüfungsformate im Zeitalter der KI',z:60,d:'Eigene Prüfungen auf KI-Anfälligkeit prüfen und anpassen.',req:['O10']},\n V8:{t:'Lehre planen mit KI',z:90,d:'Semesterplanung, Materialien und formatives Feedback mit KI.',req:['V1','V3']},\n V9:{t:'KI-Kompetenz als Lernziel',z:90,d:'Aufgabendesign im Fach und Curriculum-Mapping im Studiengang.',req:['V1','V3']},\n FU:{c:'Follow-up',t:'Transfer & Abschluss',z:30,d:'Einmalig 6 – 8 Wochen nach dem letzten Baustein: Was ist angekommen, welche Hürden gab es?',req:[]}\n};\nconst ORDER=['BASIS','O8','O1','O2','O3','O4','O5','O6','O7','O9','O10','O11','V1','V2','V3','V4','V5','V6','V7','V8','V9','FU'];\nconst code=k=>M[k].c||k;\n\n/* ── Fragen ── */\nconst FIELD={cat:'Ausgangslage · Tätigkeitsfeld',text:'In welchem Feld arbeitet Ihr Team überwiegend?',sub:'Diese Angabe zählt nicht zur Punktzahl; sie wählt die passenden Bausteine aus.',opts:[\n {key:'A',v:'verw',label:'Verwaltung & Service',hint:'Sachbearbeitung, Beratung, Kommunikation, Organisation'},\n {key:'B',v:'lehre',label:'Lehre & Prüfung',hint:'Lehrende, Prüfende, Studiengangsverantwortliche'},\n {key:'C',v:'misch',label:'Gemischtes Team',hint:'Verwaltung und Lehre, z. B. Institut oder Dekanat'},\n {key:'D',v:'lead',label:'Leitung & Steuerung',hint:'Führungskräfte, Stabsstellen, Projektverantwortliche'}]};\nconst Q=[\n {cat:'Frage 1 · Erfahrung',l:'Erfahrung',text:'Wie viele Personen im Team haben generative KI (z. B. ChatGPT, KI:connect) schon bewusst genutzt?',opts:['Niemand im Team hat KI bislang bewusst genutzt, oder wir wissen es nicht.','Einzelne Kolleginnen und Kollegen haben KI vereinzelt ausprobiert.','Einige im Team nutzen KI gelegentlich.','Etwa die Hälfte des Teams nutzt KI regelmäßig.','Die meisten im Team nutzen KI fest im Arbeitsalltag.']},\n {cat:'Frage 2 · Grundverständnis',l:'Verständnis',text:'Wie gut versteht das Team, wie generative KI grundsätzlich funktioniert?',opts:['KI ist für uns eine Blackbox.','Wir haben eine vage Vorstellung, aber keine klaren Begriffe.','Grundbegriffe wie Sprachmodell oder Training sind uns bekannt.','Wir verstehen grob, wie generative KI zu ihren Ergebnissen kommt.','Wir verstehen Funktionsweise und Grenzen sicher und können sie erklären.']},\n {cat:'Frage 3 · Haltung & Sicherheit',l:'Haltung',text:'Wie sicher und offen fühlt sich das Team im Umgang mit KI?',opts:['Im Team überwiegen Unsicherheit oder Ablehnung gegenüber KI.','Skepsis überwiegt, uns fehlt Orientierung.','Wir sind neugierig, fühlen uns aber noch unsicher.','Das Team ist offen und hat erste Routinen entwickelt.','Wir fühlen uns souverän und möchten gezielt vertiefen.']},\n {cat:'Frage 4 · Anwendung im Alltag',l:'Anwendung',text:'Gibt es konkrete Aufgaben, bei denen KI dem Team helfen könnte?',opts:['Wir sehen noch keine konkreten Einsatzmöglichkeiten.','Wir haben vage Ideen, aber noch keinen konkreten Anwendungsfall.','Wir haben erste konkrete Aufgaben benannt.','KI wird bereits punktuell für bestimmte Aufgaben eingesetzt.','KI ist fest in einzelne Abläufe integriert.']},\n {cat:'Frage 5 · Prompting-Kompetenz',l:'Prompting',text:'Wie gezielt kann das Team Anfragen an KI-Tools formulieren?',opts:['Wir haben noch nie gezielt eigene Prompts formuliert.','Wir stellen eher spontane, einfache Fragen ohne viel Kontext.','Wir haben erste gezielte Versuche mit ausführlicheren Prompts gemacht.','Wir formulieren gezielte Prompts mit Kontext- und Rollenangaben.','Wir arbeiten mit eigenen Prompt-Vorlagen für wiederkehrende Aufgaben.']},\n {cat:'Frage 6 · Qualität & Prüfung',l:'Qualität',text:'Wie geht das Team mit Fehlern und Grenzen von KI-Ergebnissen um?',opts:['Fehler und Grenzen von KI-Ergebnissen waren noch kein Thema.','Uns ist bewusst, dass KI Fehler macht; ein festes Vorgehen gibt es nicht.','Wir prüfen KI-Ergebnisse stichprobenartig.','KI-Ergebnisse werden in der Regel kritisch geprüft.','Wir haben feste Prüfroutinen etabliert.']},\n {cat:'Frage 7 · Recht & Datenschutz',l:'Recht',text:'Wie steht es um Datenschutz-, Bias- und Rechtsbewusstsein im Team?',opts:['Datenschutz, Bias und Recht wurden bislang kaum thematisiert.','Wir haben ein grobes Bewusstsein, aber kein tieferes Wissen.','Einzelne im Team kennen die wichtigsten Regeln.','Im Team besteht ein solides Grundwissen.','Wir haben klare Teamregeln zu diesen Themen etabliert.']},\n {cat:'Frage 8 · Verankerung im Team',l:'Verankerung',text:'Gibt es gemeinsame Absprachen und Zuständigkeiten zur KI-Nutzung?',opts:['Es gibt keine Absprachen, jede:r nutzt KI für sich.','Wir tauschen uns informell aus, ohne feste Absprachen.','Es gibt erste gemeinsame Absprachen.','Es gibt feste Absprachen; Zuständigkeiten sind teilweise geklärt.','Wir haben klare Regeln und Zuständigkeiten.']}\n];\nconst INTERESTS=[\n {id:'sorgen',label:'Sorgen und Vorbehalte im Team besprechen',m:['O8']},\n {id:'texte',label:'Texte verständlicher und barrierearm gestalten',m:['V6']},\n {id:'prozess',label:'Wiederkehrende Abläufe effizienter gestalten',m:['V2']},\n {id:'regeln',label:'Gemeinsame Teamregeln für KI festlegen',m:['V4']},\n {id:'projekt',label:'Ein konkretes KI-Vorhaben planen',m:['V5']},\n {id:'lehre',label:'Lehrveranstaltungen mit KI planen',m:['O9','V8']},\n {id:'pruef',label:'Prüfungen KI-sicher gestalten',m:['O10','V7']},\n {id:'schreib',label:'Studierende beim Schreiben mit KI begleiten',m:['O11']},\n {id:'curr',label:'KI-Kompetenz im Studiengang verankern',m:['V9']},\n {id:'integ',label:'Regeln zu Eigenständigkeit und Kennzeichnung klären',m:['O10']}\n];\nconst BANDS=[\n {r:[0,5],s:'Ganz am Anfang',d:'Ihr Team hat bislang kaum Berührungspunkte mit generativer KI. Bauen Sie zuerst ein gemeinsames Grundverständnis auf, ohne Druck und ohne technisches Vorwissen.',p:{verw:['O1','O2','O3'],lehre:['O1','O2','O9'],misch:['O1','O2','O3'],lead:['O1','O2','O3']}},\n {r:[6,10],s:'Erste Orientierung',d:'Erste Erfahrungen sind da, aber noch kein gemeinsames Fundament. Festigen Sie Begriffe und Funktionsweise und probieren Sie erste gezielte Prompts aus.',p:{verw:['O2','O3','O4'],lehre:['O2','O4','O9'],misch:['O2','O3','O4'],lead:['O2','O3','O4']}},\n {r:[11,16],s:'Orientierungsphase',d:'Das Team ist neugierig und hat Grundwissen. Jetzt geht es darum, konkrete Anwendungsfälle zu erschließen und Routine im Alltag zu gewinnen.',p:{verw:['O4','O5','O6'],lehre:['O4','O6','O9'],misch:['O4','O5','O6','O9'],lead:['O4','O5','O6']}},\n {r:[17,21],s:'Anwendungsbereit',d:'KI wird bereits gezielt genutzt. Vertiefen Sie kritische Prüfung und rechtliche Rahmung; danach bieten sich erste Vertiefungsbausteine an.',p:{verw:['O6','O7','V1'],lehre:['O6','O7','O10','V1'],misch:['O6','O7','V1'],lead:['O6','O7','V1','V4']}},\n {r:[22,26],s:'Vertiefungsphase',d:'Routinierte Nutzung auf solidem Fundament. Bauen Sie die Anwendungskompetenz systematisch aus: fortgeschrittenes Prompting, Workflows, Qualitätssicherung.',p:{verw:['V1','V2','V3'],lehre:['V1','V3','V8'],misch:['V1','V2','V3'],lead:['V1','V3','V4']}},\n {r:[27,32],s:'Fortgeschritten',d:'Souveräne Praxis im ganzen Team. Wählen Sie Vertiefungsbausteine nach thematischem Bedarf; das Basismodul bleibt der gemeinsame Bezugspunkt.',p:{verw:['V2','V4'],lehre:['V8','V9'],misch:['V4','V8'],lead:['V4','V5']}}\n];\n/* Feinjustierung: Frage-Index, Schwelle (≤), Bausteine */\nconst FINE=[\n {i:1,m:['O1','O2'],t:'Frage 2 niedrig'},\n {i:2,m:['O8'],t:'Frage 3 niedrig'},\n {i:5,m:['O6'],t:'Frage 6 niedrig',hi:['V3']},\n {i:6,m:['O7'],t:'Frage 7 niedrig'},\n {i:7,m:['V4'],t:'Frage 8 niedrig',minTotal:17}\n];\n/* Vorkenntnis gilt als vorhanden, wenn … */\nconst COVERED={O1:a=>a[1]>=3,O2:a=>a[1]>=3,O3:a=>a[0]>=3,O4:a=>a[4]>=3,O5:a=>a[3]>=3,O6:a=>a[5]>=3,O7:a=>a[6]>=3,V1:a=>a[4]>=4,V3:a=>a[5]>=4,V4:a=>a[7]>=4};\n\n/* ── Empfehlungslogik (deterministisch) ── */\nfunction recommend(){\n const a=pts, total=a.reduce((s,v)=>s+v,0), band=BANDS.find(b=>total>=b.r[0]&&total<=b.r[1]);\n const why={}; const add=(k,tag,cls)=>{(why[k]=why[k]||[]).some(w=>w.t===tag)||why[k].push({t:tag,c:cls});};\n add('BASIS','Pflicht für alle','');\n band.p[field].forEach(k=>add(k,'Ihr Niveau',''));\n FINE.forEach(f=>{if(a[f.i]<=1&&(!f.minTotal||total>=f.minTotal)){f.m.forEach(k=>add(k,f.t,'fine'));}});\n interests.forEach(id=>{const it=INTERESTS.find(x=>x.id===id);it.m.forEach(k=>add(k,'Anliegen','int'));});\n // Voraussetzungen ergänzen, sofern nicht durch Vorkenntnis abgedeckt\n // Erst feste Voraussetzungen ergänzen, danach Alternativen („und/oder“, „oder“ laut Modulkatalog)\n let changed=true, alts=false;\n while(changed||!alts){if(!changed)alts=true;changed=false;\n  Object.keys(why).forEach(k=>M[k].req.forEach(r=>{\n   const alt=Array.isArray(r)?r:[r];\n   if(alt.length>1&&!alts)return;\n   if(alt.some(x=>why[x]))return; if(alt.some(x=>COVERED[x]&&COVERED[x](a)))return;\n   add(alt[0],'Voraussetzung für '+code(k),'req');changed=true;}));}\n add('FU','Abschluss der Reihe','');\n const seq=ORDER.filter(k=>why[k]);\n // O8 nur vorziehen, wenn Haltung niedrig; sonst normale Position\n if(!(a[2]<=1)&&seq.includes('O8')){seq.splice(seq.indexOf('O8'),1);const i=seq.findIndex(k=>k.startsWith('V')||k==='FU');seq.splice(i,0,'O8');}\n const total_min=seq.reduce((s,k)=>s+M[k].z,0);\n const low=a.map((v,i)=>v<=1?i:-1).filter(i=>i>=0);\n return {total,band,seq,why,total_min,low};\n}\n\n/* ── Zustand ── */\nlet view='intro', step=0, field=null, pts=Array(Q.length).fill(null), interests=[], busy=false;\nconst TOTAL_STEPS=Q.length+2;\nfunction curIdx(){return view==='field'?0:view==='q'?step+1:view==='int'?Q.length+1:TOTAL_STEPS;}\nfunction topBar(){\n const c=curIdx();\n const d=Array.from({length:TOTAL_STEPS},(_,i)=>`<span class=\"step-dot ${i<c?'done':i===c&&view!=='intro'?'active':''}\"><\u002Fspan>`).join('');\n return `<div class=\"topbar\"><span class=\"brand\">Plattform für Lehren und Lernen<br>KI-Assessment für Teams<\u002Fspan>${view==='intro'?'':`<div class=\"step-indicator\">${d}<\u002Fdiv>`}<\u002Fdiv><div class=\"progress-track\"><div class=\"progress-fill\" style=\"width:${view==='intro'?0:Math.min(100,c/TOTAL_STEPS*100)}%\"><\u002Fdiv><\u002Fdiv>`;\n}\nconst foot=`<div class=\"footer-note\">Universität zu Köln · Prorektorat für Lehre und Studium<\u002Fdiv>`;\n\nfunction vIntro(){return topBar()+`<div class=\"card\"><div class=\"q-head\"><div class=\"q-meta\"><span class=\"q-num\">Vor dem Einstieg<\u002Fspan><span class=\"q-hint\">ca. 10 Minuten<\u002Fspan><\u002Fdiv><div class=\"q-text\">Wo steht Ihr Team? Selbsteinschätzung und Baustein-Empfehlung<\u002Fdiv><\u002Fdiv><div class=\"q-body\">\n<p class=\"intro-p\">Das Assessment hilft Ihrem Team, den eigenen Stand im Umgang mit generativer KI einzuschätzen. Am Ende erhalten Sie eine Empfehlung, welche Bausteine der Workshopreihe passen und in welcher Reihenfolge Sie sie durchlaufen.<\u002Fp>\n<div class=\"intro-list\">\n<div class=\"intro-item\"><span class=\"intro-n\">1<\u002Fspan><span>Geben Sie an, in welchem Feld Ihr Team arbeitet.<\u002Fspan><\u002Fdiv>\n<div class=\"intro-item\"><span class=\"intro-n\">2<\u002Fspan><span>Beantworten Sie acht Fragen gemeinsam im Team. Bei unterschiedlichen Einschätzungen wählen Sie die mittlere Antwort; die Diskussion darüber ist oft so aufschlussreich wie das Ergebnis.<\u002Fspan><\u002Fdiv>\n<div class=\"intro-item\"><span class=\"intro-n\">3<\u002Fspan><span>Wählen Sie optional konkrete Anliegen. Sie erhalten eine geordnete Bausteinfolge mit Begründung und Zeitbedarf.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"hint-box\" style=\"margin-bottom:18px\"><div class=\"hint-icon\">i<\u002Fdiv><div class=\"hint-text\">Es werden <strong>keine Daten gespeichert oder übertragen<\u002Fstrong>. Die Empfehlung ist ein Vorschlag; Sie können Bausteine weglassen oder ergänzen.<\u002Fdiv><\u002Fdiv>\n<button class=\"btn-next\" onclick=\"go('field')\">Assessment starten →<\u002Fbutton><\u002Fdiv><\u002Fdiv>`+foot;}\n\nfunction vField(){const q=FIELD;return topBar()+`<div class=\"card\"><div class=\"q-head\"><div class=\"q-meta\"><span class=\"q-num\">${q.cat}<\u002Fspan><\u002Fdiv><div class=\"q-text\">${q.text}<\u002Fdiv><div class=\"q-sub\">${q.sub}<\u002Fdiv><\u002Fdiv><div class=\"q-body\"><div class=\"options\">${q.opts.map(o=>`<button class=\"opt ${field===o.v?'sel':''}\" onclick=\"pickField('${o.v}')\"><span class=\"opt-key\">${o.key}<\u002Fspan><span>${o.label}<small>${o.hint}<\u002Fsmall><\u002Fspan><\u002Fbutton>`).join('')}<\u002Fdiv><button class=\"btn-back\" onclick=\"go('intro')\">← Zurück<\u002Fbutton><\u002Fdiv><\u002Fdiv><div class=\"key-hint\">Tastatur: A – D wählen<\u002Fdiv>`;}\n\nfunction vQ(){const q=Q[step];return topBar()+`<div class=\"card\"><div class=\"q-head\"><div class=\"q-meta\"><span class=\"q-num\">${q.cat}<\u002Fspan><span class=\"q-hint\">Teamentscheid<\u002Fspan><\u002Fdiv><div class=\"q-text\">${q.text}<\u002Fdiv><\u002Fdiv><div class=\"q-body\"><div class=\"options\">${q.opts.map((o,i)=>`<button class=\"opt ${pts[step]===i?'sel':''}\" onclick=\"pick(${i})\"><span class=\"opt-key\">${'ABCDE'[i]}<\u002Fspan><span>${o}<\u002Fspan><\u002Fbutton>`).join('')}<\u002Fdiv><button class=\"btn-back\" onclick=\"back()\">← Zurück<\u002Fbutton><\u002Fdiv><\u002Fdiv><div class=\"key-hint\">Tastatur: A – E wählen<\u002Fdiv>`;}\n\nfunction vInt(){\n const rel=field==='verw'||field==='lead'?INTERESTS.filter(x=>!['lehre','pruef','schreib','curr','integ'].includes(x.id)):field==='lehre'?INTERESTS.filter(x=>!['prozess','projekt'].includes(x.id)):INTERESTS;\n return topBar()+`<div class=\"card\"><div class=\"q-head\"><div class=\"q-meta\"><span class=\"q-num\">Anliegen · optional<\u002Fspan><span class=\"q-hint\">Mehrfachauswahl<\u002Fspan><\u002Fdiv><div class=\"q-text\">Woran möchte Ihr Team konkret arbeiten?<\u002Fdiv><div class=\"q-sub\">Die gewählten Anliegen ergänzen die Empfehlung um passende Bausteine.<\u002Fdiv><\u002Fdiv><div class=\"q-body\"><div class=\"chip-grid\">${rel.map(it=>`<button class=\"chip ${interests.includes(it.id)?'sel':''}\" onclick=\"toggleInt('${it.id}')\"><span class=\"chip-box\">${interests.includes(it.id)?'✓':''}<\u002Fspan><span>${it.label}<\u002Fspan><\u002Fbutton>`).join('')}<\u002Fdiv><button class=\"btn-next\" onclick=\"go('review')\">${interests.length?'Weiter zur Übersicht →':'Ohne Anliegen weiter →'}<\u002Fbutton><button class=\"btn-back\" onclick=\"back()\">← Zurück<\u002Fbutton><\u002Fdiv><\u002Fdiv>`;}\n\nfunction vReview(){\n const f=FIELD.opts.find(o=>o.v===field);\n const ints=interests.map(id=>INTERESTS.find(x=>x.id===id).label);\n return topBar()+`<div class=\"card\"><div class=\"q-head\"><div class=\"q-meta\"><span class=\"q-num\">Antwortübersicht<\u002Fspan><\u002Fdiv><div class=\"q-text\">Ihre Angaben im Überblick<\u002Fdiv><\u002Fdiv><div class=\"q-body\"><div class=\"review-list\">\n<div class=\"review-item\"><div><div class=\"review-q\">Tätigkeitsfeld<\u002Fdiv><div class=\"review-a\">${f.label}<\u002Fdiv><\u002Fdiv><button class=\"review-edit\" onclick=\"go('field')\">Ändern<\u002Fbutton><\u002Fdiv>\n${Q.map((q,i)=>`<div class=\"review-item\"><div><div class=\"review-q\">${q.cat}<\u002Fdiv><div class=\"review-a\">${q.opts[pts[i]]}<\u002Fdiv><\u002Fdiv><button class=\"review-edit\" onclick=\"editQ(${i})\">Ändern<\u002Fbutton><\u002Fdiv>`).join('')}\n<div class=\"review-item\"><div><div class=\"review-q\">Anliegen<\u002Fdiv><div class=\"review-a\">${ints.length?ints.join(' · '):'Keine gewählt'}<\u002Fdiv><\u002Fdiv><button class=\"review-edit\" onclick=\"go('int')\">Ändern<\u002Fbutton><\u002Fdiv>\n<\u002Fdiv><button class=\"btn-next\" onclick=\"go('result')\">Zur Auswertung →<\u002Fbutton><button class=\"btn-back\" onclick=\"go('int')\">← Zurück<\u002Fbutton><\u002Fdiv><\u002Fdiv>`;}\n\nconst fmt=m=>{const h=Math.floor(m/60),r=m%60;return h?`${h} Std.${r?' '+r+' Min.':''}`:`${r} Min.`;};\nfunction modRow(k,n,why){\n const x=M[k],cls=k==='BASIS'?'basis':k==='FU'?'fu':'';\n return `<div class=\"mod ${cls}\"><span class=\"mod-n\">${n}<\u002Fspan><div><div class=\"mod-t\"><b>${code(k)}<\u002Fb>${x.t}<\u002Fdiv><div class=\"mod-d\">${x.d}<\u002Fdiv><div class=\"why\">${why[k].map(w=>`<span class=\"${w.c}\">${w.t}<\u002Fspan>`).join('')}<\u002Fdiv><\u002Fdiv><span class=\"mod-z\">${x.z} Min.<\u002Fspan><\u002Fdiv>`;}\nfunction vResult(){\n const R=recommend(), f=FIELD.opts.find(o=>o.v===field);\n const stages=[['Schritt 1 · Gemeinsamer Einstieg',R.seq.filter(k=>k==='BASIS')],['Schritt 2 · Orientierung',R.seq.filter(k=>k.startsWith('O'))],['Schritt 3 · Vertiefung',R.seq.filter(k=>k.startsWith('V'))],['Abschluss',R.seq.filter(k=>k==='FU')]].filter(s=>s[1].length);\n let n=0; const html=stages.map(([h,ks],si)=>`<div class=\"stage\"><div class=\"stage-h\">${h}<span>${fmt(ks.reduce((s,k)=>s+M[k].z,0))}<\u002Fspan><\u002Fdiv>${ks.map(k=>modRow(k,++n,R.why)).join('')}<\u002Fdiv>`).join('');\n const vCount=R.seq.filter(k=>k.startsWith('V')).length;\n const skipped=ORDER.filter(k=>!R.seq.includes(k)&&k!=='FU');\n const lowTxt=R.low.length?`Nachholbedarf bei ${R.low.map(i=>Q[i].l).join(', ')}.`:'In keinem Bereich besteht deutlicher Nachholbedarf.';\n return topBar()+`<div class=\"card\"><div class=\"result-head\"><div class=\"result-eyebrow\">Ihr Teamergebnis<\u002Fdiv><div class=\"result-score-row\"><span class=\"result-score-num\">${R.total}<\u002Fspan><span class=\"result-score-denom\">/ 32 Punkte<\u002Fspan><\u002Fdiv><div class=\"result-standort\">${R.band.s}<\u002Fdiv><div class=\"result-meta\"><span>${f.label}<\u002Fspan><span>${R.seq.length} Termine<\u002Fspan><span>ca. ${fmt(R.total_min)} gesamt<\u002Fspan><\u002Fdiv><\u002Fdiv><div class=\"result-body\">\n<div><div class=\"section-label\">Einschätzung<\u002Fdiv><p class=\"result-desc\">${R.band.d} ${lowTxt}<\u002Fp><\u002Fdiv>\n<div><div class=\"section-label\">Profil · je Frage 0 – 4<\u002Fdiv><div class=\"profile\">${Q.map((q,i)=>`<div class=\"pf-item ${pts[i]<=1?'low':''}\"><div class=\"pf-l\">${q.l}<\u002Fdiv><div class=\"pf-bar\">${[1,2,3,4].map(s=>`<i class=\"${pts[i]>=s?'on':''}\"><\u002Fi>`).join('')}<\u002Fdiv><\u002Fdiv>`).join('')}<\u002Fdiv><\u002Fdiv>\n<div class=\"divider\"><\u002Fdiv>\n<div><div class=\"section-label\">Empfohlene Reihenfolge<\u002Fdiv>${html}<\u002Fdiv>\n<div class=\"hint-box\"><div class=\"hint-icon\">i<\u002Fdiv><div class=\"hint-text\"><strong>So planen Sie:<\u002Fstrong> Ein Baustein pro Termin, im Abstand von ein bis drei Wochen. Die Begründung unter jedem Baustein zeigt, warum er empfohlen wird: <strong>Ihr Niveau<\u002Fstrong> (Gesamtpunktzahl), <strong>Frage … niedrig<\u002Fstrong> (0 – 1 Punkte), <strong>Anliegen<\u002Fstrong> (Ihre Auswahl) oder <strong>Voraussetzung<\u002Fstrong> für einen späteren Baustein.${vCount>3?' Bei vielen Vertiefungsbausteinen lohnt es sich, nach der Orientierung neu zu priorisieren.':''}<\u002Fdiv><\u002Fdiv>\n${skipped.length?`<div class=\"later\"><b>Nicht in der Empfehlung:<\u002Fb> ${skipped.map(code).join(', ')}. Diese Bausteine können Sie jederzeit ergänzen; Beschreibungen finden Sie im Workshopkonzept.<\u002Fdiv>`:''}\n<div class=\"result-actions\"><button class=\"btn-sec\" onclick=\"window.print()\">⤓ Drucken / PDF<\u002Fbutton><button class=\"btn-sec\" onclick=\"askReset()\">↺ Neu starten<\u002Fbutton><\u002Fdiv>\n<\u002Fdiv><\u002Fdiv>`+foot;}\n\n/* ── Navigation ── */\nfunction render(){\n const v={intro:vIntro,field:vField,q:vQ,int:vInt,review:vReview,result:vResult}[view];\n document.getElementById('app').innerHTML=v(); window.scrollTo(0,0); if(window.__embedScroll)window.__embedScroll(0); notifyHeight();\n}\nfunction go(v){view=v;if(v==='q'&&step>=Q.length)step=Q.length-1;render();}\nfunction pickField(v){if(busy)return;field=v;render();busy=true;setTimeout(()=>{busy=false;if(returnToReview){returnToReview=false;go('review');}else{step=0;go('q');}},300);}\nlet returnToReview=false;\nfunction pick(i){if(busy)return;pts[step]=i;render();busy=true;setTimeout(()=>{busy=false;if(returnToReview){returnToReview=false;go('review');return;}if(step<Q.length-1){step++;go('q');}else go('int');},300);}\nfunction editQ(i){step=i;returnToReview=true;go('q');}\nfunction back(){returnToReview=false;if(view==='q'){if(step===0)go('field');else{step--;go('q');}}else if(view==='int'){step=Q.length-1;go('q');}}\nfunction toggleInt(id){interests=interests.includes(id)?interests.filter(x=>x!==id):[...interests,id];render();}\nfunction askReset(){document.body.insertAdjacentHTML('beforeend',`<div class=\"modal-backdrop\" id=\"rm\" onclick=\"if(event.target===this)this.remove()\"><div class=\"modal\" role=\"dialog\" aria-modal=\"true\"><div class=\"modal-title\">Assessment neu starten?<\u002Fdiv><p class=\"modal-text\">Ihre Angaben werden nicht gespeichert und gehen beim Neustart verloren. Drucken Sie das Ergebnis vorher als PDF, wenn Sie es aufbewahren möchten.<\u002Fp><div class=\"modal-actions\"><button class=\"btn-sec\" onclick=\"document.getElementById('rm').remove()\">Abbrechen<\u002Fbutton><button class=\"btn-next\" onclick=\"doReset()\">Neu starten<\u002Fbutton><\u002Fdiv><\u002Fdiv><\u002Fdiv>`);}\nfunction doReset(){document.getElementById('rm').remove();view='intro';step=0;field=null;pts=Array(Q.length).fill(null);interests=[];render();}\ndocument.addEventListener('keydown',e=>{const k=e.key.toUpperCase();if(document.getElementById('rm'))return;\n if(view==='field'){const o=FIELD.opts.find(o=>o.key===k);if(o)pickField(o.v);}\n else if(view==='q'){const i='ABCDE'.indexOf(k);if(i>=0&&k.length===1)pick(i);}});\nfunction notifyHeight(){if(window.__embedHeight)setTimeout(window.__embedHeight,60);}\nrender();\n/* ── Einbettung: Höhe an die einbettende Seite melden ── */\n(function(){\n  if (window.parent === window) return;\n  var last = 0, box = document.querySelector('.shell') || document.body;\n  function measure(){\n    var pb = parseFloat(getComputedStyle(document.body).paddingBottom) || 0;\n    return Math.ceil(box.getBoundingClientRect().bottom + (window.scrollY || 0) + pb);\n  }\n  function send(){\n    var h = measure();\n    if (Math.abs(h - last) < 2) return;\n    last = h;\n    window.parent.postMessage({type:'resize', height:h}, '*');\n    window.parent.postMessage({subject:'lti.frameResize', height:h}, '*');\n  }\n  window.__embedScroll = function(top){ window.parent.postMessage({type:'scrollTo', top:Math.max(0, Math.round(top||0))}, '*'); };\n  window.__embedHeight = function(){ last = 0; send(); };\n  if ('ResizeObserver' in window) new ResizeObserver(send).observe(box);\n  window.addEventListener('load', send);\n  window.addEventListener('resize', send);\n  document.addEventListener('toggle', send, true);\n  if (document.fonts && document.fonts.ready) document.fonts.ready.then(send);\n  setInterval(send, 1000);\n  send();\n})();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
